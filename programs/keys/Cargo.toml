[package]
name = "socialliquid-keys"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "socialLiquid keys: a share in a trader, on a linear USDC bonding curve with a fee share for holders"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "2.3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
